# dbt project config — names the project, binds it to the `revenue_anomaly` profile, and
# sets the per-layer defaults every model inherits.
# Exists so `dbt build` knows where models live and which schema each layer lands in.
# Staging is views in `staging`, intermediates are views in `intermediate`, marts are
# tables in `analytics` - the only schema a consumer or the agent is ever granted on.

name: 'revenue_anomaly'
version: '1.0.0'
config-version: 2

profile: 'revenue_anomaly'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

flags:
  send_anonymous_usage_stats: false

models:
  revenue_anomaly:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: analytics

seeds:
  revenue_anomaly:
    +schema: staging
